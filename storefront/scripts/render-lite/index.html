<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- KeBe Lite product renders. Driven by shoot.mjs; see its header. Same cameras, lights and export as render-v2. -->
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { STLLoader } from "three/addons/loaders/STLLoader.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

// Everything is built in the kebe repo's BOARD frame (mm, x right, y to the rear, z up, z in the case's own frame:
// 0 at its underside), from PCBs/lite/viewer/assets/lite.json, which PCBs/lite/tools/lite_viewer.py writes from the
// Lite's board, keypad drawing and the v3 case report.
const D = await (await fetch("./assets/lite.json")).json();
const [BW, BH, BR] = D.board;

const params = new URLSearchParams(location.search);
const view = params.get("view") || "hero";
const W = +params.get("w") || 2400, H = +params.get("h") || 1800;
const dark = view === "glow";
const exporting = view === "glb";
// The exported model has its LEDs on, as the site shows it on a dark ground (render-v2's rule).
const lit = dark || exporting;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = dark ? 1.0 : 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const BG = dark ? 0x0e110e : 0xd9d6cf;
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 900, 2200);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = dark ? 0.3 : 0.6;

const model = new THREE.Group();
model.rotation.x = -Math.PI / 2;
model.position.set(-BW / 2, 0, BH / 2);
scene.add(model);
const shadowy = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };

// ---- materials: the case is the r9 STL printed in MJF PA12, natural grey (no dye); no top plate (rev 2, 7 Oct
// 2026): black backlit silicone keys and web, whose laser-etched legends take each key's LED colour when lit
const M = {
  nylon: new THREE.MeshStandardMaterial({ color: 0x5c5d5a, roughness: 0.86 }),
  pcb: new THREE.MeshStandardMaterial({ color: 0xefeee8, roughness: 0.42 }),
  silicone: new THREE.MeshStandardMaterial({ color: 0x161616, roughness: 0.9 }),
  metal: new THREE.MeshStandardMaterial({ color: 0xd2d3d6, metalness: 1, roughness: 0.28 }),
  black: new THREE.MeshStandardMaterial({ color: 0x0b0b0b, roughness: 0.8 }),
};
const hue = (x) => new THREE.Color().setHSL(((x / BW) * 0.85 + 0.55) % 1, 0.95, 0.55);

// ---- the legend art, one texture over the key field (white ink, transparent ground)
const img = new Image();
img.src = "./assets/legends.svg";
await img.decode();
const legendTex = (() => {
  const px = exporting ? 8 : 14, c = document.createElement("canvas");
  c.width = Math.round(BW * px); c.height = Math.round(BH * px);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
})();

function rr(p, x0, y0, x1, y1, r) {
  p.moveTo(x0 + r, y0);
  p.lineTo(x1 - r, y0); p.absarc(x1 - r, y0 + r, r, -Math.PI / 2, 0, false);
  p.lineTo(x1, y1 - r); p.absarc(x1 - r, y1 - r, r, 0, Math.PI / 2, false);
  p.lineTo(x0 + r, y1); p.absarc(x0 + r, y1 - r, r, Math.PI / 2, Math.PI, false);
  p.lineTo(x0, y0 + r); p.absarc(x0 + r, y0 + r, r, Math.PI, Math.PI * 1.5, false);
  return p;
}
const rrc = (p, cx, cy, w, h, r) => rr(p, cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2, r);
function slab(shape, z0, t, mat) {
  const m = shadowy(new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: t, bevelEnabled: false, curveSegments: 8 }), mat));
  m.position.z = z0;
  return m;
}

// ---- the case, the real r9 STL
const stl = await new STLLoader().loadAsync("./assets/KEBE-V3-BOTTOM-r9.stl");
stl.translate(-D.b2c, -D.b2c, 0);
stl.computeVertexNormals();
model.add(shadowy(new THREE.Mesh(stl, M.nylon)));

const top = D.pcb_top, webZ = top + D.tape_t, webTop = webZ + D.web_t, keyTop = D.key_top;

// ---- the PCB edge (seen at the ports) and the four USB-C receptacles
model.add(slab(rr(new THREE.Shape(), 0, 0, BW, BH, BR), top - 1.2, 1.2, M.pcb));
const PORT = { w: 8.94, h: 3.26, y0: 79.0, y1: 86.3 };
for (const x of D.ports_x) {
  const s = rrc(new THREE.Shape(), 0, 0, PORT.w, PORT.h, PORT.h / 2);
  s.holes.push(rrc(new THREE.Path(), 0, 0, PORT.w - 0.7, PORT.h - 0.7, PORT.h / 2 - 0.35));
  const shell = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: PORT.y1 - PORT.y0, bevelEnabled: false, curveSegments: 12 }), M.metal);
  shell.rotation.x = Math.PI / 2;
  shell.position.set(x, PORT.y1, top - 3.1);
  model.add(shell);
  const tongue = new THREE.Mesh(new THREE.BoxGeometry(6.6, 3.2, 0.7), M.black);
  tongue.position.set(x, PORT.y1 - 2.0, top - 3.1);
  model.add(tongue);
}

// ---- the keypad's web on its tape, flush with the board's edges and the top surface between the keys; the keys
// rise straight out of it, with their legends
const web = new THREE.Shape(D.web_outline.map(([x, y]) => new THREE.Vector2(x, y)));
for (const k of D.keys) web.holes.push(rrc(new THREE.Path(), k.x, k.y, k.w - 0.4, k.h - 0.4, 2.2));
model.add(slab(web, webZ, D.web_t, M.silicone));
const keyZ0 = webTop;
const keyGeos = new Map();
for (const k of D.keys) {
  const id = `${k.w}x${k.h}`;
  if (!keyGeos.has(id)) keyGeos.set(id, new RoundedBoxGeometry(k.w, k.h, keyTop - keyZ0, 3, 1.0));
  const key = shadowy(new THREE.Mesh(keyGeos.get(id), M.silicone));
  key.position.set(k.x, k.y, (keyZ0 + keyTop) / 2);
  model.add(key);
  if (!k.legend) continue;
  const pg = new THREE.PlaneGeometry(k.w - 1.8, k.h - 1.8);
  const pos = pg.attributes.position, uv = pg.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, (k.x + pos.getX(i)) / BW, (k.y + pos.getY(i)) / BH);
  // Day: the laser-etched legend shows the translucent silicone under the black paint, near-white. Lit: the
  // key's own LED colour. The exported model draws it unlit, at its own brightness (no bloom in a glTF).
  const mat = lit
    ? new THREE.MeshBasicMaterial({ color: hue(k.x), map: legendTex, transparent: true, depthWrite: false })
    : new THREE.MeshStandardMaterial({ color: 0xe4e3dd, map: legendTex, transparent: true, roughness: 0.7, depthWrite: false });
  const lm = new THREE.Mesh(pg, mat);
  lm.position.set(k.x, k.y, keyTop + 0.03);
  model.add(lm);
}

// ---- floor and light (render-v2's)
const floor = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ color: BG, roughness: 1 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
if (!exporting) scene.add(floor);
const sun = new THREE.DirectionalLight(0xfff6ea, dark ? 0.25 : 3.2);
sun.position.set(-260, 380, 180);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.radius = 10;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.05;
Object.assign(sun.shadow.camera, { left: -220, right: 220, top: 160, bottom: -160, near: 50, far: 1000 });
scene.add(sun);
const fill = new THREE.DirectionalLight(0xe8eeff, dark ? 0 : 0.6);
fill.position.set(300, 120, 400);
scene.add(fill);
if (lit && !exporting) {
  // The SK6812MINI-E under each key lights its translucent key from inside; a faint pool round the key's foot.
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  g.filter = "blur(10px)";
  g.fillStyle = "#fff";
  g.fillRect(22, 22, 84, 84);
  const glowMap = new THREE.CanvasTexture(c);
  for (const k of D.keys) {
    const glow = new THREE.Mesh(new THREE.PlaneGeometry(k.w + 1.2, k.h + 1.2),
      new THREE.MeshBasicMaterial({ color: hue(k.x), map: glowMap, transparent: true, opacity: 0.35, depthWrite: false }));
    glow.position.set(k.x, k.y, webTop + 0.02);
    model.add(glow);
  }
}

// ---- cameras (render-v2's)
const cams = {
  hero:  { fov: 28, pos: [-190, 215, 390], look: [-2, 0, 4] },
  top:   { fov: 22.5, pos: [0, 600, 1], look: [0, 0, 0] },
  glow:  { fov: 28, pos: [-190, 215, 390], look: [-2, 0, 4] },
  ports: { fov: 13, pos: [150, 95, -330], look: [-78, 2, -38] },
};
const c = cams[view] ?? cams.hero;
const camera = new THREE.PerspectiveCamera(c.fov, W / H, 10, 5000);
camera.position.set(...c.pos);
camera.lookAt(...c.look);

if (exporting) {
  // glTF is in metres: 0.001 makes the model its real 257 mm, which also puts it at true size in AR.
  const root = new THREE.Group();
  root.scale.setScalar(0.001);
  root.add(model);
  const glb = await new GLTFExporter().parseAsync(root, { binary: true });
  const bytes = new Uint8Array(glb);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  window.__glb = btoa(bin);
} else if (dark) {
  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(1);
  composer.setSize(W, H);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.75, 0.5, 0.2));
  composer.addPass(new OutputPass());
  composer.render();
} else {
  renderer.render(scene, camera);
}
window.__done = true;
</script>
</body>
</html>
